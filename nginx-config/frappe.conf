upstream frappe-server {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream socketio-server {
    server 127.0.0.1:9000 fail_timeout=0;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=frappe:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name localhost frappe.local _;

    root /var/www/html/sites;

    # Logging
    access_log /var/log/nginx/frappe.access.log;
    error_log /var/log/nginx/frappe.error.log;

    # Client upload size
    client_max_body_size 50m;
    client_body_buffer_size 16k;

    # Apply rate limiting
    limit_req zone=frappe burst=20 nodelay;
    limit_conn addr 10;

    # Static file handling
    location /assets {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location /files {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Frappe backend proxy
    location / {
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;
        
        # Timeouts
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        # Buffering
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Socket.IO proxy
    location /socket.io {
        proxy_pass http://socketio-server/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Socket.IO specific timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint
    location /api/method/ping {
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:private|apps|logs|config) {
        deny all;
    }
}
